name: probe-quotes (temporary)
on:
  push:
    branches: [claude/project-thread-fskorl]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/test_worker_quotes.mjs
      - name: real Yahoo answer through the Worker code
        run: |
          cat > /tmp/p.mjs <<'JS'
          const W = (await import(process.cwd() + "/timer/worker.js")).default;
          const r = await W.fetch(new Request("https://x/quotes?s=AAPL,NVDA,QQQ,BRK.B,TSLA,ZZZZZZ", { headers: { Origin: "https://kcxdt.github.io" } }), {}, { waitUntil() {} });
          console.log(r.status, r.headers.get("access-control-allow-origin"));
          const d = await r.json(); console.log(JSON.stringify(d, null, 1));
          for (const [k, v] of Object.entries(d.q)) console.log(k, v && new Date(v.at * 1000).toLocaleString("en-US", { timeZone: "America/New_York" }), v && v.sess);
          JS
          node /tmp/p.mjs
