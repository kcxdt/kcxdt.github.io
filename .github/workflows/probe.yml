name: probe
on:
  push:
    branches: [claude/project-thread-1r9hnc]
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests
      - name: Nasdaq econ calendar raw rows
        run: |
          python - <<'PY'
          import requests, datetime, json
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json"}
          print("now UTC", datetime.datetime.utcnow())
          for day in ["2026-10-27","2026-10-28","2026-10-29","2026-11-06","2026-11-07","2026-11-09","2026-11-10","2026-11-11","2026-11-12","2026-11-13","2026-11-14","2026-11-17","2026-11-18"]:
              r = requests.get(f"https://api.nasdaq.com/api/calendar/economicevents?date={day}", headers=UA, timeout=30)
              j = r.json(); data = j.get("data") or {}
              rows = [x for x in (data.get("rows") or []) if x.get("country") == "United States"]
              print(f"=== date={day} status={r.status_code} keys={list(data.keys())} hdr={ {k:v for k,v in data.items() if k!='rows'} } US rows={len(rows)}")
              for x in rows[:40]:
                  print("   ", x.get("gmt"), "|", x.get("eventName"), "|a", x.get("actual"), "|c", x.get("consensus"), "|p", x.get("previous"), "|", {k: v for k, v in x.items() if k not in ("gmt","eventName","actual","consensus","previous","country")})
          r = requests.get("https://nfs.faireconomy.media/ff_calendar_thisweek.json", headers=UA, timeout=30)
          for x in r.json():
              if x.get("country") == "USD": print("FF", x.get("date"), x.get("title"), x.get("impact"), x.get("forecast"), x.get("previous"), {k:v for k,v in x.items() if k not in ("date","title","impact","forecast","previous","country")})
          PY
