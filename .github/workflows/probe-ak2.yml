name: probe-ak2
on:
  push:
    branches: [claude/project-thread-ak2q1p]
    paths: [probe/**, .github/workflows/probe-ak2.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python probe/etf1.py
