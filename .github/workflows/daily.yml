name: Daily update

# The close update. 21:50 UTC = 16:50 New York in winter, 17:50 in summer. GitHub often starts scheduled runs
# late or drops them (09 Nov 2026: the 22:30 run never started), so later slots are backups: with --if-due a run
# stops in seconds when the day's close is already on the history branch, or New York's day isn't a trading day.
# A Claude scheduled task also checks at 17:47 New York and dispatches this workflow when the close is missing.
# The slow fundamentals refresh runs at midday in refresh.yml, so this build takes ~10 minutes, not ~26.
on:
  schedule:
    - cron: "50 21 * * 1-5"
    - cron: "50 22,23 * * 1-5"
    - cron: "50 1,3 * * 2-6"
  workflow_dispatch:
    inputs:
      if_due:
        description: "Only run when today's update is due and not done yet (used by the outside timer in timer/)"
        type: boolean
        default: false

permissions:
  contents: write  # push the day's snapshot to the history branch
  actions: write   # start econ.yml after the close, which looks up the evening's earnings results
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.build.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Fundamentals are slow to fetch, so keep them between runs and refresh the stalest each day
      - uses: actions/cache@v4
        with:
          path: cache
          key: fundamentals-${{ github.run_id }}
          restore-keys: fundamentals-
      # Each day's snapshot is kept on the history branch, so past days show what was known then
      - name: Load past snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin history >/dev/null; then
            git clone --quiet --depth 1 --branch history "$url" hist
          else
            git init --quiet -b history hist && git -C hist remote add origin "$url"
          fi
      - id: build
        name: Build the site
        env:
          KCDT_HISTORY: hist
          KCDT_MODE: close
        run: python -m kcdt ${{ (github.event_name == 'schedule' || inputs.if_due) && '--if-due' || '' }}
      - name: Save today's snapshot
        if: github.ref == 'refs/heads/main' && steps.build.outputs.run == 'true'
        run: |
          cd hist
          git add -A
          git -c user.name="kcdt-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Snapshot $(ls 20*.json | tail -1)" || exit 0
          git push --quiet origin history
      # The intraday econ refresh (econ.yml) starts from this build
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.build.outputs.run == 'true'
        with:
          path: site
          key: site-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.run == 'true'
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub emails the repo owner about new issues, so a failed update opens one (and a later success closes it)
  report:
    needs: [build, deploy]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NOTIFY: chovy723-bot  # KC's GitHub account: assigned + mentioned, so GitHub emails KC
    steps:
      - if: needs.build.result == 'failure' || needs.deploy.result == 'failure'
        run: |
          open=$(gh issue list --label update-failed --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "@$NOTIFY 今日自動更新又失敗咗：$RUN_URL"
          else
            gh label create update-failed --color d73a4a --force
            gh issue create --label update-failed --title "KCDT daily update failed" --assignee "$NOTIFY" \
              --body "@$NOTIFY 今日自動更新失敗，網站仍然顯示上次嘅數據。Log: $RUN_URL"
          fi
      - if: needs.build.result == 'success' && needs.deploy.result == 'success'
        run: |
          for n in $(gh issue list --label update-failed --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Fixed: $RUN_URL"
          done
      # Earnings released after the close: econ.yml (kcdt.refresh) looks up today's results and publishes them.
      # Every evening call of this workflow starts one, including the backup calls that stop in seconds because
      # the close is already built (Worker 16:40 / 18:40 New York, GitHub's later slots), so results that Yahoo
      # posts an hour or two after the release still reach the page that evening.
      - name: Look up tonight's earnings results
        if: needs.build.result == 'success' && needs.deploy.result != 'failure'
        run: |
          h=$(TZ=America/New_York date +%H); d=$(TZ=America/New_York date +%u)
          if [ "$d" -le 5 ] && [ "$((10#$h))" -ge 16 ]; then gh workflow run econ.yml --ref main; else echo "not a weekday evening in New York"; fi
