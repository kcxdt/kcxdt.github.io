name: Pre-market brief

# 每日盤前需知, ready about 3 hours before the 09:30 New York open (06:30 New York).
# 09:50 UTC = 05:50 New York in summer time; 10:50 UTC = 05:50 in winter time. The script only runs when it is
# 05:30–16:00 in New York and today's brief doesn't exist yet, so the first run in that window does the work.
# GitHub starts scheduled runs late or skips them when busy (the first 09:50 run began at 10:28; on 06 Nov every
# run started after 16:50 UTC, past the old 09:30 cut-off, so there was no brief), so the :20 slots and the
# later ones are backups; a brief made after the open is marked late. A run that finds today's brief (in the
# saved site or on the history branch) stops, so the backups never make a second one. A run that fails tries
# once more after 3 minutes, and the next slot tries again if that fails too.
on:
  schedule:
    - cron: "50 9,10 * * 1-5"
    - cron: "20 10,11 * * 1-5"
    - cron: "40 12,14,16,18 * * 1-5"
  workflow_dispatch:
    inputs:
      if_due:
        description: "Only run when today's update is due and not done yet (used by the outside timer in timer/)"
        type: boolean
        default: false

permissions:
  contents: write  # keep the brief on the history branch
  pages: write
  id-token: write
  issues: write    # open an issue (emails KC) when the brief fails

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.pm.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: site
          key: site-latest
          restore-keys: site-
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: fundamentals-latest
          restore-keys: fundamentals-
      - name: Load past snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin history >/dev/null; then
            git clone --quiet --depth 1 --branch history "$url" hist
          else
            git init --quiet -b history hist && git -C hist remote add origin "$url"
          fi
      - id: pm
        name: Build the brief
        env:
          KCDT_HISTORY: hist
        run: |
          if [ ! -f site/data.json ]; then echo "no saved build yet; the next daily build will create one"; exit 1; fi
          flag="${{ (github.event_name == 'schedule' || inputs.if_due) && '--if-due' || '' }}"
          # one retry for a passing hiccup (Yahoo / Nasdaq timeouts); the brief is only written when it succeeds
          python -m kcdt.premarket $flag || { echo "failed, trying again in 3 minutes"; sleep 180; python -m kcdt.premarket $flag; }
      - name: Save the brief
        if: steps.pm.outputs.run == 'true'
        run: |
          cd hist
          git add -A
          git -c user.name="kcdt-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Pre-market brief $(ls pm/20*.json | tail -1)" || exit 0
          git push --quiet origin history
      # Later econ refreshes start from this copy, so they keep the brief
      - uses: actions/cache/save@v4
        if: steps.pm.outputs.run == 'true'
        with:
          path: site
          key: site-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.pm.outputs.run == 'true'
        with:
          path: site
  deploy:
    needs: brief
    if: needs.brief.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [brief, deploy]
    if: always() && github.ref == 'refs/heads/main' && (needs.brief.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NOTIFY: chovy723-bot  # KC's GitHub account: assigned + mentioned, so GitHub emails KC
    steps:
      - run: |
          gh label create update-failed --color d73a4a --force
          gh issue create --label update-failed --title "KCDT 盤前需知 failed $(date -u +%F)" --assignee "$NOTIFY" \
            --body "@$NOTIFY 今日盤前需知整理失敗，網站仍然顯示上一份。Log: $RUN_URL"
