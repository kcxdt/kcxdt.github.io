name: SEC quarterly verification
on:
  pull_request:
    paths:
      - kcdt/sec.py
      - tests/test_sec.py
      - .github/workflows/sec-check.yml
permissions:
  contents: read
jobs:
  quarters:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_sec.py
      - name: Verify a filed quarterly comparison against live SEC data
        run: |
          python - <<'PY'
          import requests
          from kcdt.sec import extract, growth
          headers = {"User-Agent": "KCDT research https://github.com/kcxdt/kcxdt.github.io"}
          url = "https://data.sec.gov/api/xbrl/companyfacts/CIK0000046195.json"
          response = requests.get(url, headers=headers, timeout=20)
          response.raise_for_status()
          eps = extract(response.json(), "2026-10-26", "2026-11-27")["eps"]
          latest, prior = eps["values"][0], eps["values"][4]
          assert (eps["end"], latest, prior, growth(latest, prior)) == ("2026-09-30", 1.49, 1.20, 24.2)
          print("BOH diluted EPS:", latest, prior, growth(latest, prior), eps["url"])
          PY
